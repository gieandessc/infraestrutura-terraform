openapi: 3.0.1
info:
  title: Aula API
  description: API para listar aulas
  version: 1.0.0
paths:
  /aulas:
    get:
      summary: Retorna uma lista de aulas
      responses:
        "200":
          description: Uma lista de aulas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                  example:
                    id: "1"
                    title: "Matemática"
                    description: "Aula de Matemática Básica"
